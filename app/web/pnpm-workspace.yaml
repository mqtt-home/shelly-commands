# Supply chain: never resolve a version that has been public for less than a
# week (value in minutes). Most malicious releases are pulled within days.
minimumReleaseAge: 10080

# pnpm 11 blocks dependency build scripts by default and fails the install with
# ERR_PNPM_IGNORED_BUILDS; allow the two that actually need to run so the vite
# build works.
allowBuilds:
  esbuild: true
  "@tailwindcss/oxide": true
